worker_processes  1;

pid        logs/nginx-load-test.pid;
error_log  logs/nginx-load-test-error.log warn;

events {
    worker_connections  4096;
}

http {
    default_type  application/json;
    access_log    off;
    sendfile      on;
    keepalive_timeout 30;

    # 测试专用请求头用于把攻击流量与正常流量模拟成两个客户端。
    # 生产环境应改用 $binary_remote_addr 或经过可信代理清洗后的客户端 IP。
    limit_req_zone $http_x_load_test_client zone=load_test_clients:10m rate=200r/s;

    server {
        listen 18082;
        server_name localhost;

        location / {
            limit_req zone=load_test_clients burst=200 nodelay;
            limit_req_status 429;
            error_page 429 = @nginx_rate_limited;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_pass http://127.0.0.1:18081;
        }

        location @nginx_rate_limited {
            add_header X-Rate-Limit-Layer nginx always;
            return 429 '{"success":false,"errorMsg":"请求过于频繁","layer":"nginx"}';
        }
    }
}
