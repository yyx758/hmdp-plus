worker_processes 1;

pid logs/nginx-no-rate-limit-test.pid;
error_log logs/nginx-no-rate-limit-test-error.log warn;

events {
    worker_connections 4096;
}

http {
    include D:/develop/workspace/idea/ideaprojects/hm-dianping/nginx-1.18.0/conf/mime.types;
    default_type application/json;
    access_log logs/nginx-no-rate-limit-test-access.log combined;
    keepalive_timeout 65;

    upstream hmdp_backend_without_gateway_limit {
        server 127.0.0.1:18081;
        keepalive 256;
    }

    server {
        listen 18082;
        server_name localhost;

        location /api/voucher-order/seckill/ {
            proxy_http_version 1.1;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass_request_headers on;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout;
            proxy_pass http://hmdp_backend_without_gateway_limit;
        }
    }
}
