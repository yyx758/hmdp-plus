worker_processes 1;

pid logs/nginx-rate-limit-production-test.pid;
error_log logs/nginx-rate-limit-production-test-error.log warn;

events {
    worker_connections 4096;
}

http {
    include D:/develop/workspace/idea/ideaprojects/hm-dianping/nginx-1.18.0/conf/mime.types;
    default_type application/json;
    access_log logs/nginx-rate-limit-production-test-access.log combined;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=production_seckill_gateway_ip:10m rate=250r/s;

    upstream hmdp_backend_with_gateway_limit {
        server 127.0.0.1:18081;
        keepalive 256;
    }

    server {
        listen 18083;
        server_name localhost;

        location /api/voucher-order/seckill/ {
            limit_req zone=production_seckill_gateway_ip burst=200 nodelay;
            limit_req_status 429;
            error_page 429 = @seckill_rate_limited;

            proxy_http_version 1.1;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass_request_headers on;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout;
            proxy_pass http://hmdp_backend_with_gateway_limit;
        }

        location @seckill_rate_limited {
            add_header X-Rate-Limit-Layer nginx always;
            return 429 '{"success":false,"errorMsg":"请求过于频繁，请稍后重试","layer":"nginx"}';
        }
    }
}
