server:
  port: 18081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3308/hmdp?useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    hikari:
      # 8个秒杀消费者最多占8条连接，其余连接留给普通业务和事务切换。
      maximum-pool-size: ${HMDP_DATASOURCE_MAX_POOL_SIZE:16}
      minimum-idle: ${HMDP_DATASOURCE_MIN_IDLE:8}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  redis:
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6380}
    password: ${SPRING_REDIS_PASSWORD:123456}
    lettuce:
      pool:
        # 主连接池只服务秒杀Lua、状态查询、ACK及普通缓存请求
        max-active: 32
        max-idle: 16
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      # A new per-JVM group replays retained invalidations before serving from a persisted Redis L2.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.hmdp.kafka.message
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
hmdp:
  cache:
    shop:
      local:
        enabled: ${HMDP_SHOP_LOCAL_CACHE_ENABLED:true}
        maximum-size: ${HMDP_SHOP_LOCAL_CACHE_MAXIMUM_SIZE:10000}
        expire-after-write-seconds: ${HMDP_SHOP_LOCAL_CACHE_EXPIRE_SECONDS:60}
      redis-ttl-minutes: ${HMDP_SHOP_CACHE_REDIS_TTL_MINUTES:30}
      null-ttl-seconds: ${HMDP_SHOP_CACHE_NULL_TTL_SECONDS:120}
      rebuild:
        wait-millis: ${HMDP_SHOP_CACHE_REBUILD_WAIT_MILLIS:3000}
        lease-millis: ${HMDP_SHOP_CACHE_REBUILD_LEASE_MILLIS:10000}
      bloom:
        expected-insertions: ${HMDP_SHOP_BLOOM_EXPECTED_INSERTIONS:100000}
        false-probability: ${HMDP_SHOP_BLOOM_FALSE_PROBABILITY:0.01}
    seckill-voucher:
      local:
        enabled: ${HMDP_SECKILL_LOCAL_CACHE_ENABLED:true}
        maximum-size: ${HMDP_SECKILL_LOCAL_CACHE_MAXIMUM_SIZE:10000}
        expire-after-write-seconds: ${HMDP_SECKILL_LOCAL_CACHE_EXPIRE_SECONDS:30}
      logical-ttl-seconds: ${HMDP_SECKILL_CACHE_LOGICAL_TTL_SECONDS:300}
      stale-grace-seconds: ${HMDP_SECKILL_CACHE_STALE_GRACE_SECONDS:86400}
      null-ttl-seconds: ${HMDP_SECKILL_CACHE_NULL_TTL_SECONDS:120}
      rebuild:
        wait-millis: ${HMDP_SECKILL_CACHE_REBUILD_WAIT_MILLIS:200}
        lease-millis: ${HMDP_SECKILL_CACHE_REBUILD_LEASE_MILLIS:10000}
        core-pool-size: ${HMDP_SECKILL_CACHE_REBUILD_CORE_POOL_SIZE:2}
        max-pool-size: ${HMDP_SECKILL_CACHE_REBUILD_MAX_POOL_SIZE:4}
        queue-capacity: ${HMDP_SECKILL_CACHE_REBUILD_QUEUE_CAPACITY:200}
      bloom:
        expected-insertions: ${HMDP_SECKILL_BLOOM_EXPECTED_INSERTIONS:100000}
        false-probability: ${HMDP_SECKILL_BLOOM_FALSE_PROBABILITY:0.01}
  kafka:
    seckill-order:
      topic: ${HMDP_SECKILL_ORDER_TOPIC:hmdp.seckill-order.v1}
      dlt-topic: ${HMDP_SECKILL_ORDER_DLT_TOPIC:hmdp.seckill-order.v1.DLT}
      consumer-group: ${HMDP_SECKILL_ORDER_CONSUMER_GROUP:${spring.application.name}-seckill-order}
      dlt-consumer-group: ${HMDP_SECKILL_ORDER_DLT_CONSUMER_GROUP:${spring.application.name}-seckill-order-dlt}
      partitions: ${HMDP_SECKILL_ORDER_PARTITIONS:6}
      replicas: ${HMDP_SECKILL_ORDER_REPLICAS:3}
      min-in-sync-replicas: ${HMDP_SECKILL_ORDER_MIN_IN_SYNC_REPLICAS:2}
      consumer-concurrency: ${HMDP_SECKILL_ORDER_CONSUMER_CONCURRENCY:6}
      consumer-max-poll-records: ${HMDP_SECKILL_ORDER_CONSUMER_MAX_POLL_RECORDS:100}
      retry-attempts: ${HMDP_SECKILL_ORDER_RETRY_ATTEMPTS:3}
      retry-backoff-ms: ${HMDP_SECKILL_ORDER_RETRY_BACKOFF_MS:1000}
      dlt-send-timeout-seconds: ${HMDP_SECKILL_ORDER_DLT_SEND_TIMEOUT_SECONDS:10}
      outbox:
        poll-delay-ms: ${HMDP_SECKILL_ORDER_OUTBOX_POLL_DELAY_MS:100}
        batch-size: ${HMDP_SECKILL_ORDER_OUTBOX_BATCH_SIZE:100}
        accept-batch-size: ${HMDP_SECKILL_ORDER_OUTBOX_ACCEPT_BATCH_SIZE:100}
        accept-batch-window-micros: ${HMDP_SECKILL_ORDER_OUTBOX_ACCEPT_BATCH_WINDOW_MICROS:1000}
        accept-queue-capacity: ${HMDP_SECKILL_ORDER_OUTBOX_ACCEPT_QUEUE_CAPACITY:4096}
        accept-timeout-ms: ${HMDP_SECKILL_ORDER_OUTBOX_ACCEPT_TIMEOUT_MS:5000}
        accept-writer-count: ${HMDP_SECKILL_ORDER_OUTBOX_ACCEPT_WRITER_COUNT:1}
        send-timeout-seconds: ${HMDP_SECKILL_ORDER_OUTBOX_SEND_TIMEOUT_SECONDS:10}
        relay-lease-seconds: ${HMDP_SECKILL_ORDER_OUTBOX_RELAY_LEASE_SECONDS:30}
        sent-recheck-seconds: ${HMDP_SECKILL_ORDER_OUTBOX_SENT_RECHECK_SECONDS:60}
        initial-backoff-seconds: ${HMDP_SECKILL_ORDER_OUTBOX_INITIAL_BACKOFF_SECONDS:1}
        max-backoff-seconds: ${HMDP_SECKILL_ORDER_OUTBOX_MAX_BACKOFF_SECONDS:300}
      handoff:
        batch-size: ${HMDP_SECKILL_ORDER_HANDOFF_BATCH_SIZE:100}
        idle-poll-ms: ${HMDP_SECKILL_ORDER_HANDOFF_IDLE_POLL_MS:20}
        failure-backoff-initial-ms: ${HMDP_SECKILL_ORDER_HANDOFF_FAILURE_BACKOFF_INITIAL_MS:100}
        failure-backoff-max-ms: ${HMDP_SECKILL_ORDER_HANDOFF_FAILURE_BACKOFF_MAX_MS:5000}
        relay-lease-seconds: ${HMDP_SECKILL_ORDER_HANDOFF_RELAY_LEASE_SECONDS:15}
        voucher-refresh-seconds: ${HMDP_SECKILL_ORDER_HANDOFF_VOUCHER_REFRESH_SECONDS:60}
      accepted-order-recovery:
        poll-delay-ms: ${HMDP_SECKILL_ORDER_COMPENSATION_POLL_DELAY_MS:5000}
      reconciliation:
        cron: "${HMDP_SECKILL_ORDER_RECONCILIATION_CRON:0 0 2,8,14,20 * * ?}"
        zone: ${HMDP_SECKILL_ORDER_RECONCILIATION_ZONE:Asia/Shanghai}
        full-lease-seconds: ${HMDP_SECKILL_ORDER_RECONCILIATION_FULL_LEASE_SECONDS:3600}
        recovery-lease-seconds: ${HMDP_SECKILL_ORDER_RECOVERY_LEASE_SECONDS:300}
        redis-user-batch-size: ${HMDP_SECKILL_ORDER_RECONCILIATION_REDIS_USER_BATCH_SIZE:500}
    shop-cache:
      topic: ${HMDP_SHOP_CACHE_INVALIDATION_TOPIC:hmdp.shop.cache-invalidation.v1}
      dlt-topic: ${HMDP_SHOP_CACHE_INVALIDATION_DLT_TOPIC:hmdp.shop.cache-invalidation.v1.DLT}
      # 每个JVM必须使用独立消费组，才能让每个实例都收到同一条失效消息。
      consumer-group: ${HMDP_SHOP_CACHE_CONSUMER_GROUP:${spring.application.name}-shop-cache-${random.uuid}}
      partitions: ${HMDP_SHOP_CACHE_TOPIC_PARTITIONS:3}
      # Production defaults: use at least three brokers. Local Compose overrides these to 1/1.
      replicas: ${HMDP_SHOP_CACHE_TOPIC_REPLICAS:3}
      min-in-sync-replicas: ${HMDP_SHOP_CACHE_MIN_IN_SYNC_REPLICAS:2}
      consumer-concurrency: ${HMDP_SHOP_CACHE_CONSUMER_CONCURRENCY:1}
      retry-attempts: ${HMDP_SHOP_CACHE_CONSUMER_RETRY_ATTEMPTS:3}
      retry-backoff-ms: ${HMDP_SHOP_CACHE_CONSUMER_RETRY_BACKOFF_MS:1000}
      dlt-send-timeout-seconds: ${HMDP_SHOP_CACHE_DLT_SEND_TIMEOUT_SECONDS:10}
      outbox:
        poll-delay-ms: ${HMDP_SHOP_CACHE_OUTBOX_POLL_DELAY_MS:200}
        batch-size: ${HMDP_SHOP_CACHE_OUTBOX_BATCH_SIZE:100}
        send-timeout-seconds: ${HMDP_SHOP_CACHE_OUTBOX_SEND_TIMEOUT_SECONDS:10}
        max-auto-retries: ${HMDP_SHOP_CACHE_OUTBOX_MAX_AUTO_RETRIES:12}
        initial-backoff-seconds: ${HMDP_SHOP_CACHE_OUTBOX_INITIAL_BACKOFF_SECONDS:1}
        max-backoff-seconds: ${HMDP_SHOP_CACHE_OUTBOX_MAX_BACKOFF_SECONDS:300}
    seckill-voucher-cache:
      topic: ${HMDP_SECKILL_VOUCHER_CACHE_TOPIC:hmdp.seckill-voucher.l1-invalidation.v1}
      dlt-topic: ${HMDP_SECKILL_VOUCHER_CACHE_DLT_TOPIC:hmdp.seckill-voucher.l1-invalidation.v1.DLT}
      consumer-group: ${HMDP_SECKILL_VOUCHER_CACHE_CONSUMER_GROUP:${spring.application.name}-seckill-voucher-l1-${random.uuid}}
      partitions: ${HMDP_SECKILL_VOUCHER_CACHE_PARTITIONS:3}
      replicas: ${HMDP_SECKILL_VOUCHER_CACHE_REPLICAS:3}
      min-in-sync-replicas: ${HMDP_SECKILL_VOUCHER_CACHE_MIN_IN_SYNC_REPLICAS:2}
      consumer-concurrency: ${HMDP_SECKILL_VOUCHER_CACHE_CONSUMER_CONCURRENCY:1}
      retry-attempts: ${HMDP_SECKILL_VOUCHER_CACHE_RETRY_ATTEMPTS:3}
      retry-backoff-ms: ${HMDP_SECKILL_VOUCHER_CACHE_RETRY_BACKOFF_MS:1000}
      dlt-send-timeout-seconds: ${HMDP_SECKILL_VOUCHER_CACHE_DLT_SEND_TIMEOUT_SECONDS:10}
      outbox:
        poll-delay-ms: ${HMDP_SECKILL_VOUCHER_CACHE_OUTBOX_POLL_DELAY_MS:200}
        batch-size: ${HMDP_SECKILL_VOUCHER_CACHE_OUTBOX_BATCH_SIZE:100}
        send-timeout-seconds: ${HMDP_SECKILL_VOUCHER_CACHE_OUTBOX_SEND_TIMEOUT_SECONDS:10}
        max-auto-retries: ${HMDP_SECKILL_VOUCHER_CACHE_OUTBOX_MAX_AUTO_RETRIES:12}
        initial-backoff-seconds: ${HMDP_SECKILL_VOUCHER_CACHE_OUTBOX_INITIAL_BACKOFF_SECONDS:1}
        max-backoff-seconds: ${HMDP_SECKILL_VOUCHER_CACHE_OUTBOX_MAX_BACKOFF_SECONDS:300}
  seckill:
    acceptance-mode: ${HMDP_SECKILL_ACCEPTANCE_MODE:redis-handoff}
    order-id:
      mode: ${HMDP_SECKILL_ORDER_ID_MODE:db-segment}
      segment-step: ${HMDP_SECKILL_ORDER_ID_SEGMENT_STEP:10000}
      prefetch-percent: ${HMDP_SECKILL_ORDER_ID_PREFETCH_PERCENT:20}
    access-token:
      enabled: ${HMDP_SECKILL_ACCESS_TOKEN_ENABLED:true}
      ttl-seconds: ${HMDP_SECKILL_ACCESS_TOKEN_TTL_SECONDS:30}
    rate-limit:
      enabled: ${HMDP_SECKILL_RATE_LIMIT_ENABLED:true}
      trust-forwarded-headers: ${HMDP_SECKILL_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
      vip-min-level: ${HMDP_SECKILL_RATE_LIMIT_VIP_MIN_LEVEL:1}
      high-value-min-credits: ${HMDP_SECKILL_RATE_LIMIT_HIGH_VALUE_MIN_CREDITS:1000}
      vip-capacity-multiplier: ${HMDP_SECKILL_RATE_LIMIT_VIP_MULTIPLIER:2.0}
      high-value-capacity-multiplier: ${HMDP_SECKILL_RATE_LIMIT_HIGH_VALUE_MULTIPLIER:3.0}
      issue-seckill-access-token:
        ip-window-millis: ${HMDP_SECKILL_ISSUE_ACCESS_TOKEN_IP_WINDOW_MILLIS:1000}
        ip-capacity: ${HMDP_SECKILL_ISSUE_ACCESS_TOKEN_IP_CAPACITY:200}
        user-window-millis: ${HMDP_SECKILL_ISSUE_ACCESS_TOKEN_USER_WINDOW_MILLIS:1000}
        user-capacity: ${HMDP_SECKILL_ISSUE_ACCESS_TOKEN_USER_CAPACITY:2}
      seckill-order:
        ip-window-millis: ${HMDP_SECKILL_ORDER_IP_WINDOW_MILLIS:1000}
        ip-capacity: ${HMDP_SECKILL_ORDER_IP_CAPACITY:200}
        user-window-millis: ${HMDP_SECKILL_ORDER_USER_WINDOW_MILLIS:1000}
        user-capacity: ${HMDP_SECKILL_ORDER_USER_CAPACITY:2}
      adaptive:
        enabled: ${HMDP_SECKILL_ADAPTIVE_RATE_LIMIT_ENABLED:true}
        refresh-millis: ${HMDP_SECKILL_ADAPTIVE_REFRESH_MILLIS:1000}
        warning-backlog: ${HMDP_SECKILL_WARNING_BACKLOG:1000}
        critical-backlog: ${HMDP_SECKILL_CRITICAL_BACKLOG:5000}
        warning-multiplier: ${HMDP_SECKILL_WARNING_MULTIPLIER:0.5}
        critical-multiplier: ${HMDP_SECKILL_CRITICAL_MULTIPLIER:0.1}
    marketing:
      enabled: ${HMDP_SECKILL_MARKETING_ENABLED:true}
      subscription-grace-seconds: ${HMDP_SECKILL_SUBSCRIPTION_GRACE_SECONDS:86400}
      auto-issue-batch-size: ${HMDP_SECKILL_AUTO_ISSUE_BATCH_SIZE:20}
      top-buyer-retention-days: ${HMDP_SECKILL_TOP_BUYER_RETENTION_DAYS:30}
      reminder:
        enabled: ${HMDP_SECKILL_REMINDER_ENABLED:true}
        lead-seconds: ${HMDP_SECKILL_REMINDER_LEAD_SECONDS:120}
        max-audience: ${HMDP_SECKILL_REMINDER_MAX_AUDIENCE:500}
        top-buyer-days: ${HMDP_SECKILL_REMINDER_TOP_BUYER_DAYS:30}
        top-buyer-count: ${HMDP_SECKILL_REMINDER_TOP_BUYER_COUNT:200}
        vip-min-level: ${HMDP_SECKILL_REMINDER_VIP_MIN_LEVEL:1}
        vip-count: ${HMDP_SECKILL_REMINDER_VIP_COUNT:200}
      notification:
        retention-days: ${HMDP_NOTIFICATION_RETENTION_DAYS:30}
        max-items: ${HMDP_NOTIFICATION_MAX_ITEMS:100}
        dedup-seconds: ${HMDP_NOTIFICATION_DEDUP_SECONDS:300}
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: info
  pattern:
    dateformat: mm:ss.SSS
