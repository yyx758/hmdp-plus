name: hm-dianping-dev

services:
  mysql:
    image: docker.1ms.run/library/mysql:5.7
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis-node-1:
    image: docker.1ms.run/library/redis:6.2
    ports:
      - "6380:6379"
    command: ["sh", "-c", "cp /redis-template/redis.conf /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis-data:/data
      - ./docker/redis/master.conf:/redis-template/redis.conf:ro
    networks:
      default:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-node-2:
    image: docker.1ms.run/library/redis:6.2
    ports:
      - "6381:6379"
    command: ["sh", "-c", "cp /redis-template/redis.conf /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis2-data:/data
      - ./docker/redis/replica.conf:/redis-template/redis.conf:ro
    depends_on:
      redis-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "info=$$(redis-cli -a 123456 INFO replication 2>/dev/null | tr -d '\\r'); echo \"$$info\" | grep -q '^role:master$$' || echo \"$$info\" | grep -q '^master_link_status:up$$'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.11

  redis-node-3:
    image: docker.1ms.run/library/redis:6.2
    ports:
      - "6382:6379"
    command: ["sh", "-c", "cp /redis-template/redis.conf /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis3-data:/data
      - ./docker/redis/replica.conf:/redis-template/redis.conf:ro
    depends_on:
      redis-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "info=$$(redis-cli -a 123456 INFO replication 2>/dev/null | tr -d '\\r'); echo \"$$info\" | grep -q '^role:master$$' || echo \"$$info\" | grep -q '^master_link_status:up$$'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.12

  redis-sentinel-1:
    image: docker.1ms.run/library/redis:6.2
    ports:
      - "26380:26379"
    command: ["sh", "-c", "cp /sentinel-template/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./docker/redis/sentinel.conf:/sentinel-template/sentinel.conf:ro
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.21

  redis-sentinel-2:
    image: docker.1ms.run/library/redis:6.2
    ports:
      - "26381:26379"
    command: ["sh", "-c", "cp /sentinel-template/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./docker/redis/sentinel.conf:/sentinel-template/sentinel.conf:ro
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.22

  redis-sentinel-3:
    image: docker.1ms.run/library/redis:6.2
    ports:
      - "26382:26379"
    command: ["sh", "-c", "cp /sentinel-template/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./docker/redis/sentinel.conf:/sentinel-template/sentinel.conf:ro
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.23

  kafka:
    image: docker.1ms.run/apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hmdp?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_PROFILES_ACTIVE: ${HMDP_SPRING_PROFILES_ACTIVE:-redis-sentinel}
      # 保留单机直连参数，便于本地基线测试；Sentinel Profile 启用时由哨兵配置接管。
      SPRING_REDIS_HOST: ${HMDP_SPRING_REDIS_HOST:-redis-node-1}
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: "123456"
      SPRING_REDIS_SENTINEL_MASTER: ${HMDP_SPRING_REDIS_SENTINEL_MASTER-hmdp-master}
      SPRING_REDIS_SENTINEL_NODES: ${HMDP_SPRING_REDIS_SENTINEL_NODES-redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # This development stack has one broker; production keeps the 3/2 defaults.
      HMDP_SHOP_CACHE_TOPIC_REPLICAS: "1"
      HMDP_SHOP_CACHE_MIN_IN_SYNC_REPLICAS: "1"
      HMDP_SECKILL_VOUCHER_CACHE_REPLICAS: "1"
      HMDP_SECKILL_VOUCHER_CACHE_MIN_IN_SYNC_REPLICAS: "1"
      HMDP_SECKILL_ORDER_REPLICAS: "1"
      HMDP_SECKILL_ORDER_MIN_IN_SYNC_REPLICAS: "1"
      HMDP_SHOP_LOCAL_CACHE_ENABLED: "${HMDP_SHOP_LOCAL_CACHE_ENABLED:-true}"
      # 18081 只绑定回环地址，应用只信任本机 Nginx 覆盖后的代理头。
      HMDP_SECKILL_RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      HMDP_SECKILL_RATE_LIMIT_ENABLED: ${HMDP_SECKILL_RATE_LIMIT_ENABLED:-true}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      HMDP_IMAGE_UPLOAD_DIR: /data/hmdp/imgs
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${HMDP_FRONTEND_IMAGE_DIR:-./nginx-1.18.0/html/hmdp/imgs}
        target: /data/hmdp/imgs
    ports:
      - "127.0.0.1:${HMDP_HTTP_PORT:-18081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  redis2-data:
  redis3-data:
  kafka-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
