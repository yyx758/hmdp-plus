
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # 网关层只做粗粒度削峰，保护 Java 线程和 Redis。
    # Redis 继续按“券 + 场景 + IP/用户”执行跨实例业务限流。
    limit_req_zone $binary_remote_addr zone=seckill_gateway_ip:10m rate=250r/s;

    upstream hmdp_backend {
        server 127.0.0.1:18081;
        keepalive 256;
    }

    sendfile        on;

    keepalive_timeout  65;

    server {
        listen       18080;
        server_name  localhost;

        client_max_body_size 10m;
        # 指定前端项目所在的位置
        location / {
            root   html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }


        location /api/voucher-order/seckill/ {
            limit_req zone=seckill_gateway_ip burst=200 nodelay;
            limit_req_status 429;
            error_page 429 = @seckill_rate_limited;

            default_type application/json;
            keepalive_timeout 30s;
            keepalive_requests 1000;
            proxy_http_version 1.1;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass_request_headers on;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1;
            # 覆盖客户端伪造的代理头，只把 Nginx 实际看到的来源 IP 交给应用。
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout;
            proxy_pass http://hmdp_backend;
        }

        location @seckill_rate_limited {
            add_header X-Rate-Limit-Layer nginx always;
            return 429 '{"success":false,"errorMsg":"请求过于频繁，请稍后重试","layer":"nginx"}';
        }

        location /api {
            default_type  application/json;
            #internal;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            #支持keep-alive
            proxy_http_version 1.1;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass_request_headers on;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            #more_clear_input_headers Accept-Encoding;
            proxy_next_upstream error timeout;
            proxy_pass http://hmdp_backend;
        }
    }
}
