<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>设置登录密码 - 黑马点评</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">
  <style>
    .password-container { padding: 20px 15px; }
    .password-tip { color: #888; font-size: 13px; line-height: 22px; margin-bottom: 18px; }
    .password-field { margin-bottom: 14px; }
    .submit-button { width: 100%; background: #f63; border-color: #f63; color: #fff; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">设置或修改密码</div>
  </div>
  <div class="password-container">
    <div class="password-tip">
      如果是首次设置密码，“原密码”可以留空；已经设置过密码时，必须输入正确的原密码。
    </div>
    <el-input class="password-field"
              placeholder="原密码（首次设置可留空）"
              maxlength="20"
              show-password
              v-model="form.oldPassword"></el-input>
    <el-input class="password-field"
              placeholder="新密码（6到20位）"
              maxlength="20"
              show-password
              v-model="form.newPassword"></el-input>
    <el-input class="password-field"
              placeholder="再次输入新密码"
              maxlength="20"
              show-password
              v-model="confirmPassword"
              @keyup.enter.native="save"></el-input>
    <el-button class="submit-button" :loading="saving" @click="save">保存密码</el-button>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  new Vue({
    el: "#app",
    data: {
      saving: false,
      confirmPassword: "",
      form: {
        oldPassword: "",
        newPassword: ""
      }
    },
    methods: {
      save() {
        if (!this.form.newPassword || this.form.newPassword.length < 6 || this.form.newPassword.length > 20) {
          this.$message.error("新密码长度必须为6到20位");
          return;
        }
        if (this.form.newPassword !== this.confirmPassword) {
          this.$message.error("两次输入的新密码不一致");
          return;
        }
        this.saving = true;
        axios.put("/user/password", this.form)
          .then(() => {
            this.$message.success("密码保存成功");
            setTimeout(() => location.href = "info-edit.html", 500);
          })
          .catch(err => this.$message.error(err))
          .finally(() => this.saving = false);
      },
      goBack() {
        history.back();
      }
    }
  });
</script>
</body>
</html>
