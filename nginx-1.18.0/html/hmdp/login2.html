<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>密码登录 - 黑马点评</title>
  <link href="./css/login.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/element.css">
  <style>
    .el-input__inner:focus { border-color: #f63; }
    .password-tip { color: #999; font-size: 12px; line-height: 20px; margin: 8px 0; }
    .login-switch { text-align: right; margin: 8px 0; }
    .login-switch a { color: #333; }
  </style>
</head>
<body>
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">密码登录</div>
    </div>
    <div class="content">
      <div class="login-form">
        <el-input placeholder="请输入手机号" maxlength="11" v-model.trim="form.phone"></el-input>
        <div style="height:8px"></div>
        <el-input placeholder="请输入密码"
                  maxlength="20"
                  show-password
                  v-model="form.password"
                  @keyup.enter.native="login"></el-input>
        <div class="password-tip">未设置密码？请先用验证码登录，再到“我的资料 → 登录密码”中设置。</div>
        <el-button :loading="loading"
                   @click="login"
                   style="width:100%;background-color:#f63;color:#fff;border-color:#f63">登录</el-button>
        <div class="login-switch"><a href="/login.html">验证码登录</a></div>
      </div>
      <div class="login-radio">
        <div>
          <input type="checkbox" id="readed" v-model="agreed">
          <label for="readed"></label>
        </div>
        <div>我已阅读并同意
          <a href="javascript:void(0)">《黑马点评用户服务协议》</a>、
          <a href="javascript:void(0)">《隐私政策》</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  new Vue({
    el: "#app",
    data: {
      agreed: false,
      loading: false,
      form: {
        phone: "",
        password: ""
      }
    },
    methods: {
      login() {
        if (!this.agreed) {
          this.$message.error("请先阅读并同意用户协议");
          return;
        }
        if (!/^1[3-9]\d{9}$/.test(this.form.phone)) {
          this.$message.error("请输入正确的手机号");
          return;
        }
        if (!this.form.password || this.form.password.length < 6) {
          this.$message.error("密码长度不能少于6位");
          return;
        }
        this.loading = true;
        axios.post("/user/login", this.form)
          .then(({data}) => {
            sessionStorage.setItem("token", data);
            location.href = "/info.html";
          })
          .catch(err => this.$message.error(err))
          .finally(() => this.loading = false);
      },
      goBack() {
        history.back();
      }
    }
  });
</script>
</body>
</html>
